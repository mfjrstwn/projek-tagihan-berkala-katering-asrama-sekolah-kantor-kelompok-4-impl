{% extends "base.html" %}
{% block judul %}Masuk{% endblock %}
{% block isi %}
<div class="mx-auto" style="max-width: 380px;">
  <div class="card">
    <div class="card-body">
      <h1 class="h5 text-teal mb-3">Masuk untuk melanjutkan</h1>
      {% if form.non_field_errors %}
      <div class="alert alert-danger py-2">{{ form.non_field_errors.0 }}</div>
      {% endif %}
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label" for="{{ form.username.id_for_label }}">Username</label>
          {{ form.username }}
        </div>
        <div class="mb-3">
          <label class="form-label" for="{{ form.password.id_for_label }}">Password</label>
          {{ form.password }}
        </div>
        <input type="hidden" name="next" value="{{ next }}">
        <button type="submit" class="btn btn-teal w-100">Masuk</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
