{% extends "base.html" %}
{% block judul %}{{ judul }}{% endblock %}
{% block isi %}
<div class="dialog-latar">
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-judul">
    <div class="dialog-isi" data-dialog-isi>
      <h1 id="dialog-judul">{{ judul }}</h1>
      <p>{{ pesan }}</p>
      <form method="post" action="{{ request.get_full_path }}" class="dialog-aksi">
        {% csrf_token %}
        <a class="btn btn-outline-secondary" href="{{ url_batal }}" data-dialog-tutup>Batal</a>
        <button type="submit" class="btn {{ kelas_tombol|default:'btn-danger' }}">{{ teks_tombol|default:"Hapus" }}</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
