{% extends "base.html" %}
{% block judul %}{{ judul }}{% endblock %}
{% block isi %}
<div class="card" style="max-width: 560px;">
  <div class="card-body">
    <h1 class="h5">{{ judul }}</h1>
    <p class="text-secondary">{{ pesan }}</p>
    <form method="post" class="d-flex justify-content-end gap-2">
      {% csrf_token %}
      <a class="btn btn-outline-secondary" href="{{ url_batal }}">Batal</a>
      <button type="submit" class="btn {{ kelas_tombol|default:'btn-danger' }}">{{ teks_tombol|default:"Hapus" }}</button>
    </form>
  </div>
</div>
{% endblock %}
